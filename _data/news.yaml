news_items:

  - item: "Together with my Post-doc Eszter Vigh at the IT University of Copenhagen, we have a poster at CSCW looking at how European software developers were reacting to the Greenland crisis in 2026 through their use of US AI tools"
    date: "October 2026"
    link: "http://barkhu.us/cscw2026poster.pdf"
  
  - item: "I have a paper at MobileHCI, looking at how location-sharing with parents in middle- and high school affects trust and sharing practices among young adults"
    date: "June 2026"
    link: "http://mobilehci.acm.org"
    
  - item: "My journal paper on location-sharing among young adults has finally been accepted and will be published in Journal of CSCW (ECSCW edition)"
    date: "March 2026"
    link: "https://ecscw.eusset.eu/2026/"
  
  - item: "In November 2025, I started as a researcher at NYU, in the Department of Computer Science and Engineering" 
    date: "November 2025"
    link: "https://engineering.nyu.edu/academics/departments/computer-science-and-engineering"

  - item: "From September 2023 to June 2025 I was a visiting professor at Rutgers University, in the Department of Library and Information Science"
    date: "August 2023"
    link: "https://comminfo.rutgers.edu/news/scholar-human-computer-interaction-join-sci-visiting-professor"

